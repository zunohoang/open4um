services:
  mongo:
    image: mongo:8.0.30@sha256:4a0f30875898413139bec44c73c02a05fed172578de65b644dcdcee143ae7306
    restart: unless-stopped
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:?set MONGO_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1 --port 27017
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MONGO_MEMORY_LIMIT:-640m}
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    mem_limit: ${REDIS_MEMORY_LIMIT:-160m}
    logging: *default-logging

  minio:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z@sha256:064117214caceaa8d8a90ef7caa58f2b2aeb316b5156afe9ee8da5b4d83e12c8
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?set MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
    ports:
      - 127.0.0.1:${MINIO_HOST_PORT:?set MINIO_HOST_PORT}:9000
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MINIO_MEMORY_LIMIT:-384m}
    logging: *default-logging

  server:
    image: ${ABSLIDER_SERVER_IMAGE:?set ABSLIDER_SERVER_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-3000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      RELEASE_SHA: ${RELEASE_SHA:?set RELEASE_SHA}
      RELEASE_ENVIRONMENT: ${RELEASE_ENVIRONMENT:?set RELEASE_ENVIRONMENT}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      MONGO_URI: ${MONGO_URI:?set MONGO_URI}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?set MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_USER:?set MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin ABSlider}
      ADMIN_CREDIT_BALANCE: ${ADMIN_CREDIT_BALANCE:-1000}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?set RESEND_FROM_EMAIL}
      ENABLE_EMAIL_VERIFICATION: ${ENABLE_EMAIL_VERIFICATION:-true}
    ports:
      - 127.0.0.1:${BACKEND_HOST_PORT:?set BACKEND_HOST_PORT}:4000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: ${SERVER_MEMORY_LIMIT:-512m}
    stop_grace_period: 20s
    logging: *default-logging

  client:
    image: ${ABSLIDER_CLIENT_IMAGE:?set ABSLIDER_CLIENT_IMAGE}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${FRONTEND_HOST_PORT:?set FRONTEND_HOST_PORT}:8080
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CLIENT_MEMORY_LIMIT:-128m}
    logging: *default-logging

volumes:
  mongo-data:
  redis-data:
  minio-data:
