name: Publish container images

on:
  push:
    branches:
      - develop
      - main
    paths:
      - client/**
      - server/**
      - .github/workflows/publish-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  statuses: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: zunohoang

jobs:
  publish:
    name: Wait for Jenkins and publish images
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Validate release context
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != "zunohoang/open4um" ]]; then
            echo "Refusing to publish from unexpected repository: $GITHUB_REPOSITORY" >&2
            exit 1
          fi

          case "$GITHUB_REF_NAME" in
            develop)
              release_environment='develop'
              client_api_base_url='https://dev-slides-api.sbltcup.dev/api/v1'
              ;;
            main)
              release_environment='production'
              client_api_base_url='https://slides-api.sbltcup.dev/api/v1'
              ;;
            *)
              echo "Refusing to publish from unsupported ref: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac

          {
            echo "RELEASE_ENVIRONMENT=$release_environment"
            echo "CLIENT_API_BASE_URL=$client_api_base_url"
            echo "CLIENT_IMAGE=$REGISTRY/$IMAGE_NAMESPACE/open4um-client"
            echo "SERVER_IMAGE=$REGISTRY/$IMAGE_NAMESPACE/open4um-server"
          } >>"$GITHUB_ENV"

      - name: Wait for Jenkins status on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          status_url="https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status"

          for attempt in $(seq 1 100); do
            payload="$({
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$status_url"
            })"

            jenkins_status="$({
              jq -c '
                [
                  .statuses[]
                  | select(.context | startswith("continuous-integration/jenkins/"))
                ]
                | sort_by(.updated_at)
                | last // {context: "missing", state: "missing"}
                | {context, state}
              ' <<<"$payload"
            })"

            jenkins_context="$(jq -r '.context' <<<"$jenkins_status")"
            jenkins_state="$(jq -r '.state' <<<"$jenkins_status")"
            echo "attempt=$attempt context=$jenkins_context state=$jenkins_state"

            case "$jenkins_state" in
              success)
                echo "Jenkins passed for commit $GITHUB_SHA"
                exit 0
                ;;
              error|failure)
                echo "Jenkins rejected commit $GITHUB_SHA with state=$jenkins_state" >&2
                exit 1
                ;;
              missing|pending)
                sleep 15
                ;;
              *)
                echo "Unexpected Jenkins state: $jenkins_state" >&2
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for Jenkins on commit $GITHUB_SHA" >&2
          exit 1

      - name: Check out the verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build immutable client and server images
        shell: bash
        run: |
          set -euo pipefail

          source_url="https://github.com/$GITHUB_REPOSITORY"

          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=$source_url" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.ref.name=$GITHUB_REF_NAME" \
            --build-arg "VITE_API_BASE_URL=$CLIENT_API_BASE_URL" \
            --build-arg 'VITE_ENABLE_EMAIL_VERIFICATION=true' \
            --build-arg "RELEASE_SHA=$GITHUB_SHA" \
            --build-arg "RELEASE_ENVIRONMENT=$RELEASE_ENVIRONMENT" \
            --tag "$CLIENT_IMAGE:$GITHUB_SHA" \
            client

          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=$source_url" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.ref.name=$GITHUB_REF_NAME" \
            --tag "$SERVER_IMAGE:$GITHUB_SHA" \
            server

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin

      - name: Push images and capture digests
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          client_log="$RUNNER_TEMP/client-push.log"
          server_log="$RUNNER_TEMP/server-push.log"

          extract_digest() {
            awk '
              {
                for (field = 1; field <= NF; field++) {
                  if ($field == "digest:") print $(field + 1)
                }
              }
            ' "$1" | tail -n 1
          }

          docker push "$CLIENT_IMAGE:$GITHUB_SHA" | tee "$client_log"
          client_digest="$(extract_digest "$client_log")"

          docker push "$SERVER_IMAGE:$GITHUB_SHA" | tee "$server_log"
          server_digest="$(extract_digest "$server_log")"

          for digest in "$client_digest" "$server_digest"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Registry did not return a valid immutable digest" >&2
              exit 1
            fi
          done

          docker tag "$CLIENT_IMAGE:$GITHUB_SHA" "$CLIENT_IMAGE:$GITHUB_REF_NAME"
          docker tag "$SERVER_IMAGE:$GITHUB_SHA" "$SERVER_IMAGE:$GITHUB_REF_NAME"
          docker push "$CLIENT_IMAGE:$GITHUB_REF_NAME"
          docker push "$SERVER_IMAGE:$GITHUB_REF_NAME"

          {
            echo "client-ref=$CLIENT_IMAGE@$client_digest"
            echo "server-ref=$SERVER_IMAGE@$server_digest"
          } >>"$GITHUB_OUTPUT"

          {
            echo '## Published images'
            echo
            echo "- Environment: \`$RELEASE_ENVIRONMENT\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Client: \`$CLIENT_IMAGE@$client_digest\`"
            echo "- Server: \`$SERVER_IMAGE@$server_digest\`"
            echo
            echo "The \`$GITHUB_REF_NAME\` tags are convenience pointers; deployment must use the digest references above."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: always()
        shell: bash
        run: docker logout "$REGISTRY" || true
